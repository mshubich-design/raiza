  <p><strong>Liquen simbionte</strong></p>
  
  <p><strong>Hábitat:</strong> Troncos y ramas de árboles, principalmente en zonas boscosas.</p>
  <p><strong>Función:</strong>Asociación donde el hongo aporta agua y protección, y el organismo produce nutrientes. </p> 
  <p><strong>Wood Wide Web:</strong> Relación indirecta.</p>
  <p><strong>Conexión:</strong> Árbol → líquen → ecosistema</p>
